name: test-all
on: [push]
jobs:
  platform-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11
      - run: mvn test -f system/platform-core  
      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: system/platform-core/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
